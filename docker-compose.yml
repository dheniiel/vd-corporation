services:
  apache:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: "vd-apache"
    ports:
      - "8081:80"
    volumes:
      - ./html:/var/www/html
    environment:
      - DB_HOST=mariadb-server
      - DB_USER=root
      - DB_PASS=123
      - DB_NAME=task
    depends_on:
      - db

  db:
    image: mariadb:10.5
    container_name: "mariadb-server"
    restart: always
    volumes:
      - ./database/banco.sql:/docker-entrypoint-initdb.d/banco.sql
    environment:
      - MARIADB_ROOT_PASSWORD=123
    ports:
      - "3307:3306"

  adminer:
    image: adminer:4.8.1
    container_name: "adminer"
    restart: always
    ports:
      - "8080:8080"
